name: web-check

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

env:
  APP_ENV: development
  APP_ORIGIN: http://127.0.0.1:3000
  GATEWAY_URL: http://127.0.0.1:8088
  REDIS_URL: redis://127.0.0.1:6379
  COOKIE_SECURE: 'false'
  COOKIE_PREFIX: ''

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prepare CI session encryption key
        run: |
          echo "SESSION_ENC_KEY=$(node -e "console.log(Buffer.alloc(32, 9).toString('base64'))")" >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Contract types up to date
        run: pnpm contracts:check

  web-e2e:
    runs-on: ubuntu-latest
    needs: web-check
    env:
      GATEWAY_URL: https://gateway-staging-0a47.up.railway.app
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prepare CI session encryption key
        run: |
          echo "SESSION_ENC_KEY=$(node -e "console.log(Buffer.alloc(32, 9).toString('base64'))")" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        run: pnpm build

      - name: Playwright (pages)
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

      - name: Cypress (flows)
        run: pnpm test:e2e:flows
        env:
          CI: 'true'

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
